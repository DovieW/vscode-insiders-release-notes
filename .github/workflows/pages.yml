name: Poll for new VS Code Insiders builds

on:
  workflow_dispatch:
  schedule:
    # Every hour (best-effort). Stay under upstream rate limits.
    - cron: "0 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: "insiders-poll"
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: master

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Determine latest build to process
        id: builds
        env:
          INSIDERS_COMMITS_FEED: https://update.code.visualstudio.com/api/commits/insider
          # Gate generation so we only publish builds that are actually available for users to install.
          # This matches what shows up in VS Code Insiders "About" once you've upgraded.
          INSIDERS_LATEST_UPDATE_URL: https://update.code.visualstudio.com/api/update/win32-x64-user/insider/latest
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const { pathToFileURL } = require('url');
          const { resolve } = require('path');

          const feed = process.env.INSIDERS_COMMITS_FEED;
          const latestUpdateUrl = process.env.INSIDERS_LATEST_UPDATE_URL;
          const helperUrl = pathToFileURL(resolve('scripts/fetch-json-with-retry.mjs')).href;
          // Keep this aligned with timeout-minutes above so retries stop before GitHub cancels the job.
          // This is a shared budget: if the first fetch consumes it, the poll skips rather than exceeding 1 minute.
          const pollTimeoutMs = 60000;
          const pollStartedAt = Date.now();

          async function main() {
            const { fetchJsonWithRetry, TransientFetchError } = await import(helperUrl);
            const pollHeaders = { 'User-Agent': 'insiders-changes-site' };

            function getPollFetchOptions() {
              const maxElapsedMs = pollTimeoutMs - (Date.now() - pollStartedAt);
              if (maxElapsedMs <= 0) {
                throw new TransientFetchError(`Poll budget exhausted after ${Date.now() - pollStartedAt}ms`);
              }

              return {
                headers: pollHeaders,
                maxElapsedMs,
              };
            }

            const state = JSON.parse(fs.readFileSync('data/insiders-state.json', 'utf8'));
            const last = state.lastProcessedBuildSha;

            const commits = await fetchJsonWithRetry(feed, getPollFetchOptions());
            if (!Array.isArray(commits) || commits.length === 0) throw new Error('Empty insiders commits feed');

            // Determine which build is actually available to users right now.
            // The update endpoint returns a JSON object whose `version` field is the commit SHA.
            let availableSha = commits[0];
            let availableIdx = 0;
            if (latestUpdateUrl) {
              const latest = await fetchJsonWithRetry(latestUpdateUrl, getPollFetchOptions());
              if (latest && typeof latest.version === 'string') {
                availableSha = latest.version;
                const idx = commits.indexOf(availableSha);
                if (idx !== -1) {
                  availableIdx = idx;
                } else {
                  console.warn(`Latest update SHA ${availableSha.slice(0,7)} not found in commits feed; falling back to feed head.`);
                  availableSha = commits[0];
                  availableIdx = 0;
                }
              }
            }

            let builds = [];
            if (!last) {
              builds = [availableSha]; // bootstrap: generate latest available build
            } else if (last !== availableSha) {
              // Never replay builds missed during an outage. Jump straight to the latest
              // installable build once generation works again. If the processed build is
              // newer than what the update endpoint currently reports, do not move backward.
              const lastIdx = commits.indexOf(last);
              if (lastIdx === -1 || lastIdx > availableIdx) {
                builds = [availableSha];
              } else {
                console.warn(`Last processed build ${last.slice(0,7)} is newer than latest available ${availableSha.slice(0,7)}; skipping.`);
              }
            }

            const out = builds.filter(Boolean);
            console.log(`Found ${out.length} build(s) to process.`);
            console.log(`Latest available build: ${availableSha} (feed index ${availableIdx}).`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `builds=${JSON.stringify(out)}\n`);
          }

          main().catch((err) => {
            if (err?.name === 'TransientFetchError') {
              console.warn(`${err.message}. Skipping this poll run.`);
              fs.appendFileSync(process.env.GITHUB_OUTPUT, 'builds=[]\n');
              process.exit(0);
            }
            console.error(err);
            process.exit(1);
          });
          NODE

      - name: Dispatch build workflow
        if: ${{ steps.builds.outputs.builds != '[]' }}
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          BUILDS: ${{ steps.builds.outputs.builds }}
        run: |
          node - <<'NODE'
          const { setTimeout: sleep } = require('timers/promises');

          const builds = JSON.parse(process.env.BUILDS || '[]');
          if (!builds.length) {
            console.log('No builds to dispatch.');
            process.exit(0);
          }

          const transientStatuses = new Set([408, 429, 500, 502, 503, 504]);
          const transientErrorNames = new Set(['AbortError', 'ConnectTimeoutError', 'HeadersTimeoutError']);
          const transientErrorCodes = new Set(['UND_ERR_CONNECT_TIMEOUT', 'UND_ERR_HEADERS_TIMEOUT', 'UND_ERR_SOCKET']);
          // Keep this below jobs.poll.timeout-minutes; 45s leaves ~15s of headroom for cleanup in a 60s job.
          const dispatchBudgetMs = 45000;
          const minBudgetBufferMs = 1000;
          const dispatchStartedAt = Date.now();

          function getRemainingBudgetMs() {
            return Math.max(dispatchBudgetMs - (Date.now() - dispatchStartedAt), 0);
          }

          function isTransientError(error) {
            if (!error || typeof error !== 'object') return false;
            const isFetchFailedTypeError = error instanceof TypeError && /fetch failed/i.test(error.message || '');
            const isKnownTransientErrorName = transientErrorNames.has(error.name);
            const hasTransientErrorCode = transientErrorCodes.has(error.code) || transientErrorCodes.has(error.cause?.code);
            return isFetchFailedTypeError || isKnownTransientErrorName || hasTransientErrorCode;
          }

          function calculateRetryDelay(attempt) {
            // Linear backoff: 5s, 10s, then cap at 15s for later attempts.
            return Math.min(5000 * attempt, 15000);
          }

          function formatDispatchError(buildSha, details) {
            return `Dispatch failed for ${buildSha}: ${details}`;
          }

          async function dispatch(buildSha) {
            const url = `https://api.github.com/repos/${process.env.GH_REPO}/actions/workflows/build.yml/dispatches`;
            let attempt = 0;

            while (getRemainingBudgetMs() > minBudgetBufferMs) {
              attempt += 1;

              try {
                const res = await fetch(url, {
                  method: 'POST',
                  headers: {
                    'Accept': 'application/vnd.github+json',
                    'Authorization': `Bearer ${process.env.GH_TOKEN}`,
                    'X-GitHub-Api-Version': '2022-11-28',
                  },
                  body: JSON.stringify({
                    ref: 'master',
                    inputs: { buildSha },
                  }),
                });

                if (res.ok) {
                  console.log(`Dispatched build workflow for ${buildSha} on attempt ${attempt}.`);
                  return { ok: true };
                }

                const text = await res.text();
                const message = formatDispatchError(buildSha, `${res.status} ${res.statusText} ${text}`);
                if (!transientStatuses.has(res.status)) {
                  throw new Error(message);
                }

                const delayMs = calculateRetryDelay(attempt);
                if (delayMs + minBudgetBufferMs > getRemainingBudgetMs()) {
                  console.warn(`${message}. Treating this as transient and deferring the remaining builds to the next poll.`);
                  return { ok: false, transient: true };
                }

                console.warn(`${message}. Retrying in ${Math.ceil(delayMs / 1000)}s.`);
                await sleep(delayMs);
              } catch (error) {
                if (!isTransientError(error)) {
                  throw error;
                }

                const message = formatDispatchError(buildSha, `${error.name}${error.message ? `: ${error.message}` : ''}`);
                const delayMs = calculateRetryDelay(attempt);
                if (delayMs + minBudgetBufferMs > getRemainingBudgetMs()) {
                  console.warn(`${message}. Treating this as transient and deferring the remaining builds to the next poll.`);
                  return { ok: false, transient: true };
                }

                console.warn(`${message}. Retrying in ${Math.ceil(delayMs / 1000)}s.`);
                await sleep(delayMs);
              }
            }

            console.warn(`Dispatch budget exhausted before ${buildSha} could be queued. Deferring the remaining builds to the next poll.`);
            return { ok: false, transient: true };
          }

          (async () => {
            for (const sha of builds) {
              console.log(`Dispatching build workflow for ${sha}...`);
              const result = await dispatch(sha);
              if (result?.transient) {
                break;
              }
            }
          })().catch((err) => {
            console.error(err);
            process.exit(1);
          });
          NODE
